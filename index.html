<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essenthia</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://ik.imagekit.io/a8ydbgcop/Trabajo%20Stranger%20Things/faviconst.png?updatedAt=1766716112551">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Italianno&display=swap" rel="stylesheet">

    <!-- ===== CSS DE LIBRERÍAS ===== -->
     <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
    
    <!-- Nuestro CSS propio -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Tailwind desde el CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://kit.fontawesome.com/c3fd22b8e3.js" crossorigin="anonymous"></script>

    <!-- Sistema de diseño -->
    <style type="text/tailwindcss">
        /* Modo oscuro con la clase .dark en <html> (la pone el JavaScript) */
        @custom-variant dark (&:where(.dark, .dark *));

        @theme static {
            /* Colores del modo claro. Los del modo oscuro están en css/styles.css */
            --color-primero: #753F40;
            --color-segundo: #E5E1D5;
            --color-tercero: #302F2B;
            --color-cuarto: #F5F0E6;
            --color-quinto: #455442;
            --color-sexto: #89947B;
            --color-septimo: #D9B9B2;

            --font-titulo: "Italianno", cursive;
            --font-titulo2: "Cormorant Garamond", Georgia, serif;
            --font-texto: "DM Sans", system-ui, sans-serif;
        }
    </style>
</head>
<body class="bg-segundo antialiased">
    <header class="">
        <div class="mx-auto flex flex-wrap items-center justify-between gap-4 px-5 py-5 md:py-8 md:px-8">
            <a href="#inicio" class="rounded-full border border-borde px-2 py-2 font-titulo2 text-sm font-bold md:text-2xl">
                Essenthia
            </a>

            <div class="flex items-center gap-2 md:order-last">
                <!-- Persona A: este botón cambia entre modo claro y oscuro -->
                <button id="boton-tema" type="button" aria-pressed="false"
                        class="rounded-full border border-borde px-2 py-2 text-sm md:px-4 font-semibold hover:border-acento hover:text-acento">
                    Modo oscuro
                </button>

                <!-- Persona A: este botón abre y cierra el menú en móvil -->
                <button id="boton-menu" type="button" aria-expanded="false" aria-controls="menu"
                        class="rounded-full bg-acento px-3 py-2 text-sm font-semibold text-fondo md:hidden">
                    <i class="fa-solid fa-bars text-primero"></i>
                </button>
            </div>

            <nav class="w-full md:ml-auto md:w-auto" aria-label="Principal">
                <ul id="menu" class="hidden space-y-1 pb-2 md:flex md:gap-8 md:space-y-0 md:pb-0">
                    <li><a href="#inicio" class="enlace-menu block py-2">Inicio</a></li>
                    <li><a href="#productos" class="enlace-menu block py-2">Productos</a></li>
                    <li><a href="#preguntas" class="enlace-menu block py-2">Preguntas</a></li>
                    <li><a href="#visitanos" class="enlace-menu block py-2">Visítanos</a></li>
                </ul>
            </nav>
        </div>
    </header>
 
    <!-- =====JAVASCRIPT ===== -->
     <script src="js/jquery-3.6.1.min.js"></script>
     <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
